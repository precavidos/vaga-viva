name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # setup-java caches the dependencies, not the Maven distribution the wrapper downloads.
      - name: Cache the Maven distribution
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      # A failed download from Maven Central should not fail the build.
      - name: Download Maven
        run: |
          for attempt in 1 2 3; do
            ./mvnw -B -q -v > /dev/null && exit 0
            echo "Maven download failed (attempt $attempt of 3); retrying in 15 s."
            sleep 15
          done
          exit 1
      - name: Build and test
        run: ./mvnw -B verify

  # Deploys only after the tests pass on main. Render builds the image from the Dockerfile;
  # its own auto-deploy stays off so a red build never reaches the demo (see docs/deploy.md).
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.API_URL }}
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not set; skipping deploy."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
