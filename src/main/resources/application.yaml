spring:
  application:
    name: vaga-viva
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vagaviva}
    username: ${DATABASE_USERNAME:vagaviva}
    password: ${DATABASE_PASSWORD:vagaviva}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

vagaviva:
  llm:
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-haiku-5-5
    timeout: 30s
    max-retries: 1
