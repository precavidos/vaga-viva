spring:
  application:
    name: vaga-viva
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vagaviva}
    username: ${DATABASE_USERNAME:vagaviva}
    password: ${DATABASE_PASSWORD:vagaviva}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  http:
    clients:
      # GitHub redirects artifact downloads to a storage host: following by hand keeps the token away from it.
      redirects: dont-follow
  security:
    oauth2:
      client:
        registration:
          github:
            # Client ID and secret of the Vaga Viva GitHub App (docs/github-app.md).
            client-id: ${GITHUB_CLIENT_ID:not-configured}
            client-secret: ${GITHUB_CLIENT_SECRET:not-configured}

server:
  port: ${PORT:8080}
  # Render terminates TLS: trust its X-Forwarded-* headers so redirects and the OAuth callback use https.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

vagaviva:
  github:
    app-slug: ${GITHUB_APP_SLUG:vaga-viva}
    # The app's own credentials, for webhooks and the reviewer (docs/github-app.md). Blank turns the webhook off.
    app:
      id: ${GITHUB_APP_ID:}
      private-key: ${GITHUB_APP_PRIVATE_KEY:}
      webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
      slug: ${GITHUB_APP_SLUG:vaga-viva}
  classroom:
    stuck-after: 3d
    idle-after: 5d
    teachers: ${CLASSROOM_TEACHERS:}
    summary-secret: ${CLASSROOM_SUMMARY_SECRET:}
  llm:
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-haiku-5-5
    timeout: 30s
    max-retries: 0
